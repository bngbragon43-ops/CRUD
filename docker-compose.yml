services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "${APP_PORT:-8000}:80"

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: php_devops
      DB_USER: root
      DB_PASSWORD: root
      MOCKSERVER_BASE_URL: http://mockserver:1080
      API_BASE_URL: http://localhost

    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    build:
      context: ./docker/mysql
      dockerfile: Dockerfile

    environment:
      MYSQL_DATABASE: php_devops
      MYSQL_ROOT_PASSWORD: root

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -proot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 3s

  mockserver:
    build:
      context: ./docker/mockserver
      dockerfile: Dockerfile

    ports:
      - "${MOCKSERVER_PORT:-1080}:1080"

    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/expectations.json

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile

    user: root

    ports:
      - "${JENKINS_PORT:-8080}:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  mysql_data:
  jenkins_home:
